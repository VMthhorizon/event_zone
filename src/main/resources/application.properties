spring.application.name=event_zone
# env.properties file import
spring.config.import=optional:file:env.properties
# Web Server configuration
server.port=${PORT}
# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
# JWT Secret
jwt.secret=${JWT_SECRET}
# Cloudinary configuration
cloudinary.name=${CLOUDINARY_NAME}
cloudinary.apikey=${CLOUDINARY_API_KEY}
cloudinary.secret=${CLOUDINARY_SECRET}
# Brevo EmailSender configuration
spring.mail.host=${BREVO_HOST}
spring.mail.port=${BREVO_PORT}
brevo.api.url=${BREVO_API_URL}
brevo.api.key=${BREVO_API_KEY}
app.mail.sender=${BREVO_SENDER}
spring.mail.password=${BREVO_SMTP_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
